name: offline_ai_chat
description: "Offline AI chat: on-device LLM chat for Android and iOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # llama.cpp via FFI. Pinned exactly: pre-1.0 API, native ABI tied to the
  # llamadart-native release it downloads (v0.4.1).
  llamadart: 0.8.24
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  sherpa_onnx: 1.13.8
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.6
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

hooks:
  user_defines:
    llamadart:
      # Bundle only the llama.cpp runtime (not LiteRT-LM) ...
      llamadart_native_runtimes:
        runtimes: [llama_cpp]
      # ... with CPU kernels only. Vulkan/GPU offload is a later experiment.
      llamadart_native_backends:
        platforms:
          android-arm64: [cpu]
          android-x64: [cpu]
          windows-x64: [cpu]

flutter:
  uses-material-design: true
  assets:
    # Licence texts for native runtimes and model weights (see
    # lib/app/third_party_licenses.dart).
    - assets/licenses/
